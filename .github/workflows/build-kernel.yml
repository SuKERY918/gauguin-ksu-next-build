name: Build gauguin kernel + KernelSU-Next (legacy)

on:
  workflow_dispatch:
    inputs:
      enable_lto:
        description: 'Enable LTO_CLANG (matches stock build, much slower)'
        type: boolean
        default: false
      skip_ksu_probe:
        description: 'Skip the fast KernelSU-only compile probe'
        type: boolean
        default: false

env:
  KERNEL_REPO: https://github.com/PixelOS-Devices/android_kernel_xiaomi_gauguin
  KERNEL_COMMIT: a0a88748828bdf4ad9a66c09fab9dd29e566e721
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KSU_BRANCH: legacy
  KSU_VERSION_OVERRIDE_VAL: '33355'
  KSU_TAG_OVERRIDE_VAL: v3.4.2
  CLANG_VER: clang-r563880c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            python3 zip unzip curl git cpio rsync gcc-aarch64-linux-gnu

      - name: Cache clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: clang-${{ env.CLANG_VER }}-msft-v1

      - name: Fetch AOSP clang (sparse checkout from AOSP mirror)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          ok=0
          for branch in android16-qpr2-release android16-release main master; do
            echo "== trying branch: $branch"
            rm -rf clang-src
            git clone -q --filter=blob:none --no-checkout --depth 1 -b "$branch" \
              https://github.com/msft-mirror-aosp/platform.prebuilts.clang.host.linux-x86.git clang-src || continue
            if ( cd clang-src && git sparse-checkout init --cone && \
                 git sparse-checkout set "$CLANG_VER" && git checkout -q ); then
              if [ -x "clang-src/$CLANG_VER/bin/clang" ]; then ok=1; break; fi
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "!! unable to fetch $CLANG_VER"
            exit 1
          fi
          mkdir -p toolchain
          mv "clang-src/$CLANG_VER" toolchain/clang
          rm -rf clang-src

      - name: Verify toolchain
        run: |
          set -e
          toolchain/clang/bin/clang --version
          toolchain/clang/bin/ld.lld --version || true
          ls toolchain/clang/bin | head -12

      - name: Clone kernel source at exact commit
        run: |
          set -e
          git init -q kernel
          cd kernel
          git remote add origin "$KERNEL_REPO"
          git fetch --depth 1 origin "$KERNEL_COMMIT"
          git checkout -q FETCH_HEAD
          echo "== HEAD: $(git log -1 --format='%H %cI %s')"
          echo "== localversion-cip: $(cat localversion-cip 2>/dev/null || echo none)"
          echo "== localversion-st : $(cat localversion-st 2>/dev/null || echo none)"
          sed -n '1,6p' Makefile

      - name: Integrate KernelSU-Next (legacy)
        run: |
          set -e
          git clone -q --depth 1 -b "$KSU_BRANCH" "$KSU_REPO" ksun
          echo "== KSU commit: $(git -C ksun log -1 --format='%H %cI %s')"
          # kernel/include/uapi 在仓库里是指向 ../../uapi 的符号链接。
          # cp -r 会把符号链接原样复制 -> 目标处变成断链 -> uapi/*.h 找不到。
          # 必须用 -L 解引用；再显式铺一遍 uapi 头文件作为双保险。
          cp -rL ksun/kernel kernel/drivers/kernelsu
          rm -rf kernel/drivers/kernelsu/include/uapi
          mkdir -p kernel/drivers/kernelsu/include/uapi
          cp ksun/uapi/*.h kernel/drivers/kernelsu/include/uapi/
          echo "== uapi headers:"; ls kernel/drivers/kernelsu/include/uapi/
          # 修掉 legacy 分支 patch_memory.c 的宏污染：它在 #include <linux/uaccess.h>
          # 之前 #define copy_to_kernel_nofault(...)，而本内核 uaccess.h:306 正好
          # 声明了同名函数，导致声明被宏展开、clang 报 type specifier missing。
          # 详见 scripts/fix_patch_memory.py
          python3 "$GITHUB_WORKSPACE/scripts/fix_patch_memory.py" \
            kernel/drivers/kernelsu/hook/patch_memory.c
          sed -n '24,36p' kernel/drivers/kernelsu/hook/patch_memory.c
          grep -q "kernelsu" kernel/drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          echo "== drivers/Makefile tail:"; tail -3 kernel/drivers/Makefile
          echo "== drivers/Kconfig:"; grep -n "kernelsu" kernel/drivers/Kconfig

      - name: Configure kernel
        run: |
          set -e
          export PATH="$PWD/toolchain/clang/bin:$PATH"
          make -C kernel O="$PWD/out" ARCH=arm64 vendor/lito-perf_defconfig
          cat kernel/arch/arm64/configs/vendor/xiaomi/gauguin.config >> out/.config
          cat >> out/.config <<'EOF'

          # ---- KernelSU-Next (legacy, non-GKI) ----
          CONFIG_KSU=y
          CONFIG_KSU_SYSCALL_TABLE_HOOK=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_DEBUG is not set

          # ---- 容忍度调整 ----
          # 本内核 CONFIG_CC_WERROR=y，且默认 CONFIG_FRAME_WARN=2048。
          # 原厂用 LTO 编译时不会触发，但我们关掉 LTO 提速后，clang 21 对老代码
          # 的栈帧分析更严格，会命中：
          #   drivers/power/supply/maxim/sha384_software.c: sha3_256_hmac
          #   stack frame size (2912) exceeds limit (2048) [-Werror,-Wframe-larger-than]
          # 同机型已验证的处理方式：关闭 CC_WERROR 并把 FRAME_WARN 放宽到 4096。
          # CONFIG_CC_WERROR is not set
          CONFIG_FRAME_WARN=4096
          EOF
          if [ "${{ inputs.enable_lto }}" = "false" ]; then
            sed -i 's/^CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' out/.config
            sed -i 's/^CONFIG_LTO=y/# CONFIG_LTO is not set/' out/.config
          fi
          make -C kernel O="$PWD/out" ARCH=arm64 olddefconfig
          echo "== effective config:"
          grep -E "^(# )?CONFIG_(KSU|KSU_SYSCALL_TABLE_HOOK|LTO|LTO_CLANG|CFI_CLANG|KPROBES|MODULES|EXT4_FS|CC_WERROR|FRAME_WARN|CC_IS|LD_IS)[ =]" out/.config | sort

      - name: Probe KernelSU compile (fast fail)
        if: ${{ inputs.skip_ksu_probe == false }}
        run: |
          set -e
          export PATH="$PWD/toolchain/clang/bin:$PATH"
          MK="ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- \
              CLANG_TRIPLE=aarch64-linux-gnu- LLVM_IAS=1 \
              KSU_VERSION_OVERRIDE=$KSU_VERSION_OVERRIDE_VAL \
              KSU_VERSION_TAG_OVERRIDE=$KSU_TAG_OVERRIDE_VAL"
          make -C kernel O="$PWD/out" -j"$(nproc)" $MK prepare 2>&1 | tail -5
          # flask.h 等 SELinux 生成文件必须先生成，否则 KSU 编译会报
          # security/selinux/include/security.h: flask.h file not found
          make -C kernel O="$PWD/out" -j"$(nproc)" $MK security/selinux/ 2>&1 | tail -5
          make -C kernel O="$PWD/out" -j"$(nproc)" $MK drivers/kernelsu/
          echo "== KernelSU objects built OK"

      - name: Build kernel Image
        run: |
          set -e
          export PATH="$PWD/toolchain/clang/bin:$PATH"
          MK="ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- \
              CLANG_TRIPLE=aarch64-linux-gnu- LLVM_IAS=1 \
              KSU_VERSION_OVERRIDE=$KSU_VERSION_OVERRIDE_VAL \
              KSU_VERSION_TAG_OVERRIDE=$KSU_TAG_OVERRIDE_VAL"
          make -C kernel O="$PWD/out" -j"$(nproc)" $MK Image
          ls -l out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Collect outputs
        run: |
          set -e
          mkdir -p dist
          cp out/arch/arm64/boot/Image dist/Image
          cp out/.config dist/kernel.config
          echo "== KSU symbols present in vmlinux:"
          grep -c "ksu_" out/vmlinux.map 2>/dev/null || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: gauguin-ksu-image
          path: dist/
          if-no-files-found: error
          retention-days: 14
